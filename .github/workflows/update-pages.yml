name: Update GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/resources/**

jobs:
  update-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Rebuild pages branch
        run: python3 readme-to-pages.py
